<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Jolly Roger skull -->
  <symbol id="op-skull" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="28" r="18" fill="#fff8e7" stroke="#0a2342" stroke-width="2.5"/>
    <ellipse cx="24" cy="26" rx="5" ry="6" fill="#0a2342"/>
    <ellipse cx="40" cy="26" rx="5" ry="6" fill="#0a2342"/>
    <path d="M28 36h8M30 40h4" stroke="#0a2342" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 46c4 6 10 9 14 9s10-3 14-9" stroke="#0a2342" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 48v6M32 52v6M42 48v6" stroke="#0a2342" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12 22c4-10 12-14 20-14s16 4 20 14" stroke="#e8a317" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <!-- Straw hat -->
  <symbol id="op-hat" viewBox="0 0 64 64" fill="none">
    <ellipse cx="32" cy="42" rx="26" ry="8" fill="#f5c518" stroke="#0a2342" stroke-width="2"/>
    <path d="M16 42c0-14 7-24 16-24s16 10 16 24" fill="#ffe07a" stroke="#0a2342" stroke-width="2"/>
    <path d="M14 38h36" stroke="#c41e3a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="28" r="3" fill="#c41e3a"/>
  </symbol>

  <!-- Going Merryish ship -->
  <symbol id="op-ship" viewBox="0 0 64 64" fill="none">
    <path d="M8 44c6 8 18 12 24 12s18-4 24-12" fill="#0a4aa8" stroke="#0a2342" stroke-width="2"/>
    <path d="M12 44h40l-4 8H16z" fill="#8b5a2b" stroke="#0a2342" stroke-width="2"/>
    <path d="M32 12v32" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
    <path d="M34 14l18 10H34z" fill="#fff8e7" stroke="#0a2342" stroke-width="2"/>
    <path d="M30 18l-12 8h12z" fill="#c41e3a" stroke="#0a2342" stroke-width="2"/>
    <circle cx="32" cy="10" r="4" fill="#f5c518" stroke="#0a2342" stroke-width="1.5"/>
  </symbol>

  <!-- Katana -->
  <symbol id="op-sword" viewBox="0 0 64 64" fill="none">
    <path d="M48 8L20 36" stroke="#bcdcff" stroke-width="5" stroke-linecap="round"/>
    <path d="M48 8L20 36" stroke="#0a2342" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 38l-6 6" stroke="#c47f0e" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 34l8 8" stroke="#e8a317" stroke-width="3" stroke-linecap="round"/>
    <circle cx="14" cy="46" r="4" fill="#c41e3a" stroke="#0a2342" stroke-width="1.5"/>
    <path d="M42 12l6 6" stroke="#0a2342" stroke-width="2"/>
  </symbol>

  <!-- Sea chart / map -->
  <symbol id="op-map" viewBox="0 0 64 64" fill="none">
    <path d="M10 14l14-4 16 4 14-4v40l-14 4-16-4-14 4z" fill="#f4e4c1" stroke="#0a2342" stroke-width="2"/>
    <path d="M24 10v40M40 14v40" stroke="#0a2342" stroke-width="1.5" opacity=".35"/>
    <path d="M16 28c6-8 12-4 18-10s10 2 14 0" stroke="#0a4aa8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="44" cy="36" r="5" fill="none" stroke="#c41e3a" stroke-width="2"/>
    <path d="M44 31v10M39 36h10" stroke="#c41e3a" stroke-width="2"/>
  </symbol>

  <!-- Berry coin -->
  <symbol id="op-berry" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="22" fill="#f5c518" stroke="#0a2342" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="16" fill="none" stroke="#c47f0e" stroke-width="2"/>
    <text x="32" y="40" text-anchor="middle" font-family="Pirata One, Georgia, serif" font-size="22" fill="#0a2342">B</text>
  </symbol>

  <!-- Treasure chest -->
  <symbol id="op-chest" viewBox="0 0 64 64" fill="none">
    <rect x="10" y="28" width="44" height="24" rx="3" fill="#8b5a2b" stroke="#0a2342" stroke-width="2"/>
    <path d="M10 28c0-12 10-18 22-18s22 6 22 18" fill="#a0522d" stroke="#0a2342" stroke-width="2"/>
    <rect x="28" y="34" width="8" height="10" rx="1" fill="#f5c518" stroke="#0a2342" stroke-width="1.5"/>
    <path d="M10 36h44" stroke="#0a2342" stroke-width="2"/>
    <circle cx="22" cy="22" r="3" fill="#f5c518"/>
    <circle cx="42" cy="20" r="2.5" fill="#ffe07a"/>
  </symbol>

  <!-- Logbook scroll -->
  <symbol id="op-scroll" viewBox="0 0 64 64" fill="none">
    <path d="M16 12h28a6 6 0 010 12H18a4 4 0 00-4 4v24a6 6 0 006 6h28" fill="#fff8e7" stroke="#0a2342" stroke-width="2"/>
    <path d="M14 16a4 4 0 118 0v4H18a4 4 0 01-4-4z" fill="#f4e4c1" stroke="#0a2342" stroke-width="2"/>
    <path d="M22 32h24M22 40h18M22 48h20" stroke="#0a4aa8" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Shipwright hammer -->
  <symbol id="op-hammer" viewBox="0 0 64 64" fill="none">
    <path d="M28 20l16-10 8 12-16 10z" fill="#7a8a99" stroke="#0a2342" stroke-width="2"/>
    <path d="M30 28L18 52" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 28L18 52" stroke="#0a2342" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="18" r="3" fill="#c41e3a"/>
  </symbol>

  <!-- Gear Second bolt -->
  <symbol id="op-bolt" viewBox="0 0 64 64" fill="none">
    <path d="M36 6L16 34h14l-4 24 24-32H34l2-20z" fill="#f5c518" stroke="#0a2342" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

  <!-- Compass -->
  <symbol id="op-compass" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="22" fill="#fff8e7" stroke="#0a2342" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="16" fill="none" stroke="#0a4aa8" stroke-width="1.5"/>
    <path d="M32 14v6M32 44v6M14 32h6M44 32h6" stroke="#0a2342" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 20l6 12-6 12-6-12z" fill="#c41e3a" stroke="#0a2342" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="3" fill="#f5c518" stroke="#0a2342" stroke-width="1.5"/>
  </symbol>

  <!-- Anchor -->
  <symbol id="op-anchor" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="14" r="6" fill="none" stroke="#0a2342" stroke-width="3"/>
    <path d="M32 20v28" stroke="#0a2342" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 32h24" stroke="#0a2342" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 40c4 12 12 16 18 16s14-4 18-16" stroke="#0a4aa8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- Wanted poster -->
  <symbol id="op-wanted" viewBox="0 0 64 64" fill="none">
    <rect x="12" y="6" width="40" height="52" rx="2" fill="#f4e4c1" stroke="#0a2342" stroke-width="2"/>
    <text x="32" y="18" text-anchor="middle" font-family="Pirata One, Georgia, serif" font-size="8" fill="#c41e3a">WANTED</text>
    <circle cx="32" cy="32" r="10" fill="#ffe07a" stroke="#0a2342" stroke-width="1.5"/>
    <ellipse cx="28" cy="30" rx="2" ry="2.5" fill="#0a2342"/>
    <ellipse cx="36" cy="30" rx="2" ry="2.5" fill="#0a2342"/>
    <path d="M28 36c2 2 6 2 8 0" stroke="#0a2342" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 48h24" stroke="#0a2342" stroke-width="2"/>
  </symbol>

  <!-- Meat on bone (Luffy) -->
  <symbol id="op-meat" viewBox="0 0 64 64" fill="none">
    <path d="M18 40c-6-6-4-18 6-24s20-4 24 4c8 12-2 28-16 28-6 0-10-2-14-8z" fill="#c41e3a" stroke="#0a2342" stroke-width="2"/>
    <path d="M40 22c4 2 8 8 6 14" stroke="#9e1530" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 18l10-10" stroke="#fff8e7" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 18l10-10" stroke="#0a2342" stroke-width="2" stroke-linecap="round"/>
    <circle cx="52" cy="10" r="3" fill="#fff8e7" stroke="#0a2342" stroke-width="1.5"/>
  </symbol>

  <!-- Wave -->
  <symbol id="op-wave" viewBox="0 0 64 64" fill="none">
    <path d="M4 36c8-12 16-12 24 0s16 12 24 0 8-12 12-6" stroke="#1e7ef0" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M4 48c8-10 16-10 24 0s16 10 24 0 8-10 12-4" stroke="#0a4aa8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- Devil fruit -->
  <symbol id="op-fruit" viewBox="0 0 64 64" fill="none">
    <ellipse cx="32" cy="36" rx="18" ry="20" fill="#7c3aed" stroke="#0a2342" stroke-width="2"/>
    <path d="M20 28c6 4 12 4 18 0M22 38c5 3 11 3 16 0M24 48c4 2 8 2 12 0" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M32 16c0-6 4-10 8-10" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 16c4-2 8 0 10 4" stroke="#40916c" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- Subquest flag -->
  <symbol id="op-flag" viewBox="0 0 64 64" fill="none">
    <path d="M16 8v48" stroke="#5c4033" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 10h28l-6 10 6 10H18z" fill="#c41e3a" stroke="#0a2342" stroke-width="2"/>
    <circle cx="28" cy="20" r="4" fill="#fff8e7" stroke="#0a2342" stroke-width="1.5"/>
  </symbol>
</svg>
